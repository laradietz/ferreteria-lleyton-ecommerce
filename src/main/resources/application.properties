# ── Datasource ──────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ─────────────────────────────────────────
# IMPORTANTE: se usa "update" a propósito (en vez de un schema.sql escrito a
# mano) para que Hibernate genere las tablas con VARCHAR para los enums,
# evitando el clásico problema de tipos ENUM nativos de Postgres que no
# coinciden con @Enumerated(EnumType.STRING).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── Server ──────────────────────────────────────────────────
server.port=${SERVER_PORT:8083}
server.error.include-message=always

# ── JWT ─────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:cambiar_esta_clave_en_produccion_min_256_bits_1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Swagger / OpenAPI ───────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ── Seed data (usuario admin inicial) ──────────────────────
app.seed.enabled=${SEED_ENABLED:true}
app.seed.admin-username=${SEED_ADMIN_USERNAME:admin}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:admin123}

# ── Fotos de productos ──────────────────────────────────────
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
